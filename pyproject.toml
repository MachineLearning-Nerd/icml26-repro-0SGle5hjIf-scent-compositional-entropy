[project]
name = "scent-reproduction"
version = "0.1.0"
description = "CPU reproduction campaign for arXiv:2602.02877"
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface-hub",
  "marimo>=0.15",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pillow>=10",
  "psutil>=6",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "torch>=2.5",
  "torchvision>=0.20",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
